version: 1
default_environment: dev
project_id: liveli-mysql-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-mysql
      variant: meltanolabs
      pip_url: meltanolabs-tap-mysql
      # Connection params come from env at runtime:
      #   TAP_MYSQL_HOST, TAP_MYSQL_PORT, TAP_MYSQL_USER,
      #   TAP_MYSQL_PASSWORD, TAP_MYSQL_DATABASE,
      #   TAP_MYSQL_FILTER_DBS (JSON array — restricts which databases
      #   are replicated; same gotcha as postgres' filter_schemas, just
      #   under a different config key in MeltanoLabs' tap-mysql).
      config:
        ssl: false
        # Default to the customer-named database only. Without a filter
        # the tap discovers every schema including mysql/sys/perf_schema
        # and target-bigquery crashes on reserved BQ prefixes.
        filter_dbs: []

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git@v0.7.4
      # Config comes from env at runtime:
      #   TARGET_BIGQUERY_PROJECT, TARGET_BIGQUERY_DATASET,
      #   TARGET_BIGQUERY_LOCATION
      # batch_job over storage_write_api for cross-region safety —
      # storage_write_api hits BrokenPipeError against EU multi-region.
      config:
        method: batch_job
        denormalized: true
        upsert: true
