version: 1
default_environment: dev
project_id: liveli-sage-intacct-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-intacct
      variant: hotglue
      # Sage Intacct XML Gateway API. Two credential layers: a sender
      # (app-level, issued by Sage to the integration) and a user
      # (the customer's web-services login). Not on PyPI → install from git.
      pip_url: git+https://github.com/hotgluexyz/tap-intacct.git
      # Required env:
      #   TAP_INTACCT_COMPANY_ID, TAP_INTACCT_SENDER_ID,
      #   TAP_INTACCT_SENDER_PASSWORD, TAP_INTACCT_USER_ID,
      #   TAP_INTACCT_USER_PASSWORD, TAP_INTACCT_START_DATE
      settings:
        - name: company_id
        - name: sender_id
        - name: sender_password
          kind: password
        - name: user_id
        - name: user_password
          kind: password
        - name: start_date
      config:
        start_date: "2022-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      config:
        method: batch_job
        denormalized: true
        upsert: true
