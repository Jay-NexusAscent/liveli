version: 1
default_environment: prod
project_id: liveli-hubspot-to-bq

environments:
  - name: prod

plugins:
  extractors:
    - name: tap-hubspot
      variant: meltanolabs
      pip_url: meltanolabs-tap-hubspot
      # Required env:
      #   TAP_HUBSPOT_ACCESS_TOKEN (private app token)
      config:
        start_date: "2020-01-01T00:00:00Z"
      select:
        - contacts.*
        - companies.*
        - deals.*
        - engagements.*
        - tickets.*
        - owners.*
        - products.*

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git@v0.7.4
      config:
        method: batch_job_load
        denormalized: true
        upsert: true
