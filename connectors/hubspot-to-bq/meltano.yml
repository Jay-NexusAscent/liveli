version: 1
default_environment: dev
project_id: liveli-hubspot-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-hubspot
      variant: meltanolabs
      # Install from git rather than PyPI — MeltanoLabs publishes
      # tap-hubspot to GitHub but not to PyPI under the
      # `meltanolabs-tap-hubspot` name (404 on pypi.org). Builds
      # started failing 2026-05-23 when the deploy workflow
      # re-resolved during the meltano lock step.
      pip_url: git+https://github.com/MeltanoLabs/tap-hubspot.git
      # Required env at runtime:
      #   TAP_HUBSPOT_ACCESS_TOKEN  (HubSpot Private App token)
      # Optional:
      #   TAP_HUBSPOT_START_DATE    (ISO8601; entrypoint sets a sensible default)
      config:
        start_date: "2020-01-01T00:00:00Z"
      # Limit to the CRM-core streams — engagements + tickets + products
      # are useful but not always populated; include them anyway because
      # customers expect them in any CRM connector.
      select:
        - contacts.*
        - companies.*
        - deals.*
        - engagements.*
        - tickets.*
        - owners.*
        - products.*

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      config:
        method: batch_job
        denormalized: true
        upsert: true
