version: 1
default_environment: dev
project_id: liveli-amplitude-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-amplitude
      # singer-io variant — deliberately NOT the hub default. The hub
      # default is an Airbyte wrapper (tap-airbyte-wrapper) that needs
      # Docker-in-Docker at runtime to start an Airbyte source
      # container. Our Cloud Run Job containers can't run Docker
      # inside Docker — DinD requires privileged mode which Cloud Run
      # doesn't grant. singer-io is the classic Singer tap, pure
      # Python, no Docker dependency.
      variant: singer-io
      pip_url: tap-amplitude
      # Required env at runtime:
      #   TAP_AMPLITUDE_API_KEY     (Amplitude API Key)
      #   TAP_AMPLITUDE_API_SECRET  (Amplitude Secret Key — both from
      #                              Amplitude → Settings → Projects)
      config:
        start_date: "2023-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      config:
        method: batch_job
        denormalized: true
        upsert: true
