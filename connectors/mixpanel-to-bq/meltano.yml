version: 1
default_environment: dev
project_id: liveli-mixpanel-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-mixpanel
      # hotgluexyz variant — the hub's current default. We initially
      # picked `singer-io` thinking it was the canonical Stitch tap,
      # but as of mid-2026 it's been DE-REGISTERED from the Meltano
      # Hub. The remaining variants on the hub are:
      #   hotgluexyz (default), transferwise, airbyte, bytecodeio.
      # hotgluexyz is the same maintainer as tap-quickbooks (which
      # works reliably for us) so this is the lowest-risk choice.
      # See LIVELI-128 PR-merge deploy failure (singer-io not found).
      variant: hotgluexyz
      pip_url: git+https://github.com/hotgluexyz/tap-mixpanel.git
      # Required env at runtime:
      #   TAP_MIXPANEL_API_SECRET  (Mixpanel Project API Secret —
      #                             Project Settings → Access Keys)
      config:
        start_date: "2023-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      config:
        method: batch_job
        denormalized: true
        upsert: true
