version: 1
default_environment: dev
project_id: liveli-postgres-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-postgres
      variant: meltanolabs
      pip_url: meltanolabs-tap-postgres
      # Connection params come from env at runtime:
      #   TAP_POSTGRES_HOST, TAP_POSTGRES_PORT, TAP_POSTGRES_USER,
      #   TAP_POSTGRES_PASSWORD, TAP_POSTGRES_DATABASE
      config:
        ssl: true
        ssl_mode: prefer

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      # Config comes from env at runtime:
      #   TARGET_BIGQUERY_PROJECT, TARGET_BIGQUERY_DATASET,
      #   TARGET_BIGQUERY_LOCATION
      # storage_write_api was crashing with BrokenPipeError when targeting
      # EU multi-region datasets — z3z1ma issue. batch_job_load is slower
      # (writes JSON to GCS then loads) but rock-solid and works across
      # any BQ region. Acceptable tradeoff for reliable demo + production.
      config:
        method: batch_job_load
        denormalized: true
        upsert: true
