version: 1
default_environment: dev
project_id: liveli-postgres-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-postgres
      variant: meltanolabs
      pip_url: meltanolabs-tap-postgres
      # Connection params come from env at runtime:
      #   TAP_POSTGRES_HOST, TAP_POSTGRES_PORT, TAP_POSTGRES_USER,
      #   TAP_POSTGRES_PASSWORD, TAP_POSTGRES_DATABASE,
      #   TAP_POSTGRES_FILTER_SCHEMAS (JSON array, overrides default below)
      config:
        ssl: true
        # ssl_mode: require — NOT `prefer`.
        # `prefer` makes psycopg2 attempt a non-SSL handshake first and
        # only fall back to SSL after the server refuses. Neon's pooler
        # rejects the non-SSL attempt with `connection is insecure (try
        # using sslmode=require)` — visible in Cloud Run Job logs even
        # when the eventual SSL retry succeeds. Most managed Postgres
        # providers (Neon, Supabase, RDS with rds.force_ssl) refuse
        # non-SSL connections outright, so `require` is the only mode
        # that works against all of them without a noisy first round-trip.
        ssl_mode: require
        # Default to user schema only. Without this the tap discovers
        # pg_catalog + information_schema and target-bigquery crashes
        # creating tables like "information_schema__pg_..." because BQ
        # reserves the `information_schema` namespace. Override per-run
        # via TAP_POSTGRES_FILTER_SCHEMAS.
        filter_schemas: ["public"]

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      # Config comes from env at runtime:
      #   TARGET_BIGQUERY_PROJECT, TARGET_BIGQUERY_DATASET,
      #   TARGET_BIGQUERY_LOCATION
      # storage_write_api was crashing with BrokenPipeError when targeting
      # EU multi-region datasets — z3z1ma issue. `batch_job` uses BQ's
      # load-job API (buffers in memory, single load per stream). Slower
      # than storage_write_api but rock-solid and works across any region.
      # If we hit memory issues on large tables, swap to `gcs_stage`.
      #
      # upsert (MERGE on PK) — the only mode that supports genuine
      # INCREMENTAL sync without data loss. History overview:
      #
      # 1. Original: upsert: true. Tables without a PK silently failed
      #    MERGE, leaving staging tables stranded. Switched to overwrite.
      # 2. overwrite + INCREMENTAL replication (added later by the
      #    postgres introspection PR) = catastrophic data loss. Each
      #    incremental sync emitted only the delta, overwrite then
      #    replaced the whole canonical table with that delta. Two
      #    years of demo data reduced to a single day. LIVELI-111.
      # 3. Now (this rewrite): upsert: true again — but with explicit
      #    PK gating in `lib/postgres-introspection.ts`. Tables without
      #    a single-column primary key are EXCLUDED from sync at
      #    connect time (surfaced to the user) and never reach the
      #    loader. Tables WITH a single-column PK use INCREMENTAL when
      #    an updated_at-style column is available, FULL_TABLE otherwise.
      #    In BOTH cases target-bigquery MERGEs on the PK emitted by
      #    tap-postgres, so history is preserved.
      #
      # Outcomes:
      #   - History never wiped: MERGE only INSERTs new rows or UPDATEs
      #     existing ones — there's no "drop and replace" step.
      #   - Sync cost scales with delta size for INCREMENTAL tables —
      #     the only sensible behaviour for B2B SaaS customers with
      #     million-row tables on hourly schedules.
      #   - No-PK tables fail fast at connect time with a clear UI
      #     warning, not silently mid-sync. Follow-up ticket to add a
      #     parallel `overwrite: true` extractor invocation for
      #     no-PK tables (LIVELI-? — in flight).
      #   - Staging-table leaks (the original reason for the overwrite
      #     switch) are guarded by `cleanupStaleStagingTables` running
      #     pre-sync — belt-and-braces against any z3z1ma edge case.
      #
      # SaaS connectors (Stripe/HubSpot/Shopify/etc.) are also on
      # `upsert: true` — their taps reliably emit key_properties from
      # the source API's stable `id` field. Only postgres + mysql
      # needed the PK-gating layer added on top.
      config:
        method: batch_job
        denormalized: true
        upsert: true
