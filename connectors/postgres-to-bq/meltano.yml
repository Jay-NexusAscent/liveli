version: 1
default_environment: dev
project_id: liveli-postgres-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-postgres
      variant: meltanolabs
      pip_url: meltanolabs-tap-postgres
      # Connection params come from env at runtime:
      #   TAP_POSTGRES_HOST, TAP_POSTGRES_PORT, TAP_POSTGRES_USER,
      #   TAP_POSTGRES_PASSWORD, TAP_POSTGRES_DATABASE,
      #   TAP_POSTGRES_FILTER_SCHEMAS (JSON array, overrides default below)
      config:
        ssl: true
        # ssl_mode: require — NOT `prefer`.
        # `prefer` makes psycopg2 attempt a non-SSL handshake first and
        # only fall back to SSL after the server refuses. Neon's pooler
        # rejects the non-SSL attempt with `connection is insecure (try
        # using sslmode=require)` — visible in Cloud Run Job logs even
        # when the eventual SSL retry succeeds. Most managed Postgres
        # providers (Neon, Supabase, RDS with rds.force_ssl) refuse
        # non-SSL connections outright, so `require` is the only mode
        # that works against all of them without a noisy first round-trip.
        ssl_mode: require
        # Default to user schema only. Without this the tap discovers
        # pg_catalog + information_schema and target-bigquery crashes
        # creating tables like "information_schema__pg_..." because BQ
        # reserves the `information_schema` namespace. Override per-run
        # via TAP_POSTGRES_FILTER_SCHEMAS.
        filter_schemas: ["public"]

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      # Config comes from env at runtime:
      #   TARGET_BIGQUERY_PROJECT, TARGET_BIGQUERY_DATASET,
      #   TARGET_BIGQUERY_LOCATION
      # storage_write_api was crashing with BrokenPipeError when targeting
      # EU multi-region datasets — z3z1ma issue. `batch_job` uses BQ's
      # load-job API (buffers in memory, single load per stream). Slower
      # than storage_write_api but rock-solid and works across any region.
      # If we hit memory issues on large tables, swap to `gcs_stage`.
      #
      # overwrite (not upsert) — z3z1ma's batch_job in upsert mode requires
      # the tap to emit `key_properties` for every stream. tap-postgres only
      # emits key_properties for tables with an actual PRIMARY KEY constraint
      # in the source; tables without PKs cause the MERGE step to silently
      # fail, leaving staging tables (`<table>__<timestamp>__<uuid>`) stranded
      # in the dataset uncleaned. The agent then sees both canonical (stale)
      # and dozens of staging duplicates. Symptom in production: `public_orders`
      # with 1k stale rows + 80× `public_orders__YYYYMMDDHHMMSS__<uuid>` each
      # holding the actual 150k rows.
      #
      # overwrite mode atomically replaces the canonical table with fresh
      # data on every sync. Doesn't depend on PK detection. Drops its own
      # staging tables cleanly after the swap. Matches the architectural
      # reality that Meltano state is ephemeral on Cloud Run Jobs anyway —
      # every sync is a full extract, so incremental merge was never
      # delivering its theoretical benefit.
      #
      # SaaS connectors (Stripe/HubSpot/Shopify/etc.) stay on `upsert: true`
      # because their taps reliably emit key_properties (every Stripe Charge
      # has an `id`, every Shopify Order has an `id` — guaranteed by the
      # source API contract). Only relational-DB connectors need overwrite.
      config:
        method: batch_job
        denormalized: true
        overwrite: true
