version: 1
default_environment: dev
project_id: liveli-square-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-square
      variant: hotglue
      # hotglue variant takes a single Square access token (a Personal
      # Access Token from the Square dashboard) — far simpler than the
      # singer-io variant which requires a full OAuth client+refresh flow.
      # Not on PyPI under a clean name → install from git. Required env:
      #   TAP_SQUARE_ACCESS_TOKEN
      # Optional:
      #   TAP_SQUARE_START_DATE, TAP_SQUARE_SANDBOX ("true"/"false")
      pip_url: git+https://gitlab.com/hotglue/tap-square.git
      settings:
        - name: access_token
          kind: password
        - name: start_date
        - name: sandbox
          kind: boolean
      config:
        sandbox: false
        start_date: "2022-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      config:
        method: batch_job
        denormalized: true
        upsert: true
