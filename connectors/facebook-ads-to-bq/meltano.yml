version: 1
default_environment: prod
project_id: liveli-facebook-ads-to-bq

environments:
  - name: prod

plugins:
  extractors:
    - name: tap-facebook
      variant: meltano
      pip_url: git+https://github.com/MeltanoLabs/tap-meta.git
      # Required env (Meta Marketing API v18+):
      #   TAP_FACEBOOK_ACCESS_TOKEN  (long-lived Meta access token)
      #   TAP_FACEBOOK_ACCOUNT_ID    (single act_xxxxxx — multiple as separate connectors)
      config:
        start_date: "2024-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git@v0.7.4
      config:
        method: batch_job
        denormalized: true
        upsert: true
