version: 1
default_environment: dev
project_id: liveli-facebook-ads-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-facebook
      variant: meltanolabs
      pip_url: meltanolabs-tap-facebook
      # Required env at runtime (Meta Marketing API v18+):
      #   TAP_FACEBOOK_ACCESS_TOKEN  (long-lived Meta access token)
      #   TAP_FACEBOOK_ACCOUNT_ID    (single act_xxxxxx — multiple ad
      #                               accounts = multiple connectors)
      # Optional:
      #   TAP_FACEBOOK_START_DATE    (ISO8601; defaults to 2024-01-01 below)
      config:
        start_date: "2024-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git@v0.7.4
      config:
        method: batch_job
        denormalized: true
        upsert: true
