version: 1
default_environment: dev
project_id: liveli-mailchimp-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-mailchimp
      variant: meltanolabs
      pip_url: meltanolabs-tap-mailchimp
      # Required env at runtime:
      #   TAP_MAILCHIMP_API_KEY  (the "-usN" suffix on the API key
      #                           selects the data center; the tap
      #                           parses it out, so customers paste
      #                           the whole key as-is)
      # Optional:
      #   TAP_MAILCHIMP_START_DATE  (ISO8601; defaults to config below)
      config:
        start_date: "2022-01-01T00:00:00Z"

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git@v0.7.4
      config:
        method: batch_job
        denormalized: true
        upsert: true
