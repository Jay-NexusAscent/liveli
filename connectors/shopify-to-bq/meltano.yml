version: 1
default_environment: dev
project_id: liveli-shopify-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-shopify
      variant: meltanolabs
      pip_url: meltanolabs-tap-shopify
      # Required env at runtime:
      #   TAP_SHOPIFY_STORE         (the {store}.myshopify.com handle, without the protocol)
      #   TAP_SHOPIFY_ADMIN_API_KEY (Admin API access token, starts with shpat_)
      config:
        api_version: "2024-10"
      select:
        - orders.*
        - products.*
        - customers.*
        - inventory_items.*
        - transactions.*
        - refunds.*
        - locations.*

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git@v0.7.4
      config:
        method: batch_job
        denormalized: true
        upsert: true
