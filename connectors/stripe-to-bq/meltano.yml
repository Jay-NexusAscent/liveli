version: 1
default_environment: dev
project_id: liveli-stripe-to-bq

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-stripe
      # `hotgluexyz` variant was REMOVED from the Meltano Hub registry
      # — `meltano lock --update --all` fails with "variant 'hotgluexyz'
      # is not known to Meltano" as of 2026-05-23. Hub default is now
      # `singer-io` (Stitch Data's variant — actively maintained, the
      # canonical Singer reference implementation). hotgluexyz was
      # already 4 years stale (last release April 2022) so this
      # migration was overdue anyway — see LIVELI-120 background.
      variant: singer-io
      pip_url: tap-stripe
      # Required env at runtime:
      #   TAP_STRIPE_CLIENT_SECRET  (sk_live_... or sk_test_...)
      # Optional:
      #   TAP_STRIPE_START_DATE     (ISO8601; entrypoint defaults to 1y ago)
      config: {}
      # Restrict replication to the customer-facing core entities. The
      # full Stripe object surface is huge (events, balance_transactions,
      # exchange rates) and most of it is noise for a "talk to your data"
      # product. Expand the list when customers ask for it.
      select:
        - charges.*
        - customers.*
        - subscriptions.*
        - invoices.*
        - payouts.*
        - refunds.*

  loaders:
    - name: target-bigquery
      variant: z3z1ma
      pip_url: git+https://github.com/z3z1ma/target-bigquery.git
      config:
        method: batch_job
        denormalized: true
        upsert: true
