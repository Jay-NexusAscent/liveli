name: Deploy connectors

on:
  push:
    branches: [main]
    # `dbt/**` is watched because the dbt project is baked into the
    # dbt-runner image at build time (COPY dbt /app/dbt). A change to
    # any model therefore requires rebuilding that image — see the
    # dbt-runner mapping in the detect-changes step below.
    paths: ["connectors/**", "dbt/**", ".github/workflows/deploy-connectors.yml"]
  workflow_dispatch:
    inputs:
      connector:
        description: "Specific connector to (re)build. Leave blank for normal diff-based detection; '*' forces all."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-connectors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Stage 1: figure out what actually changed ─────────────────────
  #
  # Static-matrix builds-all-on-every-push waste ~6-8 min × 8 unchanged
  # connectors per single-connector PR. This job computes a dynamic
  # matrix from the push diff so only changed connectors fan out to
  # the build job.
  #
  # Decision tree:
  #   workflow_dispatch + specific connector input → that one
  #   workflow_dispatch + "*" or empty input       → all
  #   push with unreachable BEFORE (force push,    → all (safe fallback)
  #     initial push, history GC'd)
  #   push + workflow file itself changed          → all (the workflow
  #     change may affect every build step, so revalidate everywhere)
  #   push + only some connectors changed          → just those
  #   push + no connector dirs changed             → empty matrix; the
  #     build job below is skipped via its `if:` condition
  detect-changes:
    name: Detect changed connectors
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      empty: ${{ steps.set-matrix.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the BEFORE..SHA diff works for any reachable
          # commit. Default fetch-depth (1) would shallow-clone and the
          # diff against BEFORE would fail.
          fetch-depth: 0

      - id: set-matrix
        name: Compute matrix from diff
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.connector }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Helper: emit the matrix JSON + empty flag, then return.
          emit_matrix() {
            local items="$1"
            local matrix
            if [ -z "$items" ]; then
              matrix='{"connector":[]}'
              echo "empty=true" >> "$GITHUB_OUTPUT"
            else
              matrix=$(echo "$items" \
                | jq -R -s -c 'split("\n") | map(select(length > 0)) | { connector: . }')
              echo "empty=false" >> "$GITHUB_OUTPUT"
            fi
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "→ matrix: $matrix"
          }

          # Helper: enumerate every connector by reading the directory.
          # Avoids a hard-coded list that would drift as connectors are
          # added — the same directory layout the build step expects.
          all_connectors() {
            find connectors -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort
          }

          # Case 1: manual run with a specific connector input → that one.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
             && [ -n "$DISPATCH_INPUT" ] \
             && [ "$DISPATCH_INPUT" != "*" ]; then
            echo "→ workflow_dispatch connector=$DISPATCH_INPUT"
            emit_matrix "$DISPATCH_INPUT"
            exit 0
          fi

          # Case 2: manual run with empty / "*" input → all connectors.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "→ workflow_dispatch with no specific connector — building all"
            emit_matrix "$(all_connectors)"
            exit 0
          fi

          # Case 3: BEFORE is missing or unreachable (initial push, force
          # push, history rewritten). Diff is unreliable — build all.
          # Better to over-build than miss a needed deploy.
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
            echo "→ BEFORE ($BEFORE) is missing or unreachable — building all"
            emit_matrix "$(all_connectors)"
            exit 0
          fi

          # Case 4: workflow file itself changed in the push range. A
          # change to build/push/update steps applies to every connector,
          # so we revalidate everywhere.
          if git diff --name-only "$BEFORE" "$SHA" \
             | grep -q "^\.github/workflows/deploy-connectors\.yml$"; then
            echo "→ workflow file changed — building all"
            emit_matrix "$(all_connectors)"
            exit 0
          fi

          # Case 5 (typical): only the connectors with changes in the push.
          #
          # `{ grep ... || true; }` is critical. With `set -euo pipefail`
          # in effect, an unmatched grep returns exit 1, pipefail
          # propagates it, set -e kills the script — and we never reach
          # emit_matrix or the dbt-runner mapping below. This bit on the
          # first dbt-only push to main (PR #107), where the diff had
          # zero `connectors/**` paths. Latent bug present since the
          # workflow was written; PR #106's `dbt/**` trigger surfaced it
          # by enabling pushes with no connector-dir changes.
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA" \
            | { grep "^connectors/" || true; } \
            | awk -F/ '{print $2}' \
            | sort -u)

          # dbt project changes → rebuild the dbt-runner image. The dbt
          # project lives at repo ROOT (dbt/), not under connectors/, so
          # the grep above misses it — but the project is COPY'd into the
          # dbt-runner image at build time, so a model change means that
          # image is stale until rebuilt. Append `dbt-runner` to the
          # matrix when any dbt/** file changed. sort -u dedupes in case
          # connectors/dbt-runner/ ALSO changed in the same push; the
          # grep -v '^$' drops the empty line when CHANGED started empty
          # (dbt-only push).
          if git diff --name-only "$BEFORE" "$SHA" | grep -q "^dbt/"; then
            echo "→ dbt/ changed — adding dbt-runner to the matrix"
            CHANGED=$(printf '%s\n%s\n' "$CHANGED" "dbt-runner" | grep -v '^$' | sort -u)
          fi

          echo "→ connectors to build in $BEFORE..$SHA:"
          echo "$CHANGED" | sed 's/^/    /'
          emit_matrix "$CHANGED"

  # ── Stage 2: build, push, and update Cloud Run Jobs ───────────────
  #
  # `if:` skips the whole job (matrix not even materialised) when no
  # connectors need building — GitHub Actions shows it as Skipped, no
  # red-X noise.
  build:
    name: ${{ matrix.connector }}
    needs: detect-changes
    if: needs.detect-changes.outputs.empty != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    env:
      # Artifact Registry stays in europe-west4 — image binaries aren't
      # customer data, and Cloud Run can pull from any region. The
      # Cloud Run Jobs themselves are deployed PER RESIDENCY into the
      # regions listed below (matches the EU/US suffix scheme in
      # infra/cloud-run.tf + src/lib/gcp.ts).
      AR_REGION: europe-west4
      PROJECT_ID: liveli-496609
      REPO: liveli-connectors

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $AR_REGION-docker.pkg.dev --quiet

      - name: Build image
        id: build
        run: |
          IMAGE_URI="$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:${GITHUB_SHA::12}"
          # dbt-runner is special: its Dockerfile needs to COPY the
          # repo-root `dbt/` project into the image. So we build with
          # the repo root as context and point at the Dockerfile
          # explicitly. Every other connector builds with its own
          # dir as context (self-contained). Keeping the dbt project
          # at repo root (not inside connectors/dbt-runner/) matters
          # for dev UX — IDE dbt extensions expect that location.
          if [ "${{ matrix.connector }}" = "dbt-runner" ]; then
            docker build \
              -t "$IMAGE_URI" \
              -t "$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest" \
              -f connectors/dbt-runner/Dockerfile \
              .
          else
            docker build \
              -t "$IMAGE_URI" \
              -t "$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest" \
              connectors/${{ matrix.connector }}
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker push "$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest"

      # Update BOTH residency-suffixed jobs from the same image. The
      # job names are `connector-<type>-eu` (in europe-west1) and
      # `connector-<type>-us` (in us-central1) — see infra/cloud-run.tf.
      # Each region's job is updated independently; failure in one
      # doesn't block the other (set -e is on, but we tee through).
      - name: Update Cloud Run Job image (EU residency)
        run: |
          gcloud run jobs update "connector-${{ matrix.connector }}-eu" \
            --image "$IMAGE_URI" \
            --region "europe-west1" \
            --project "$PROJECT_ID"

      - name: Update Cloud Run Job image (US residency)
        run: |
          gcloud run jobs update "connector-${{ matrix.connector }}-us" \
            --image "$IMAGE_URI" \
            --region "us-central1" \
            --project "$PROJECT_ID"
