name: Deploy connectors

on:
  push:
    branches: [main]
    paths: ["connectors/**", ".github/workflows/deploy-connectors.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-connectors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-to-bq:
    name: postgres-to-bq
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      REGION: europe-west4
      PROJECT_ID: liveli-496609
      REPO: liveli-connectors
      IMAGE: postgres-to-bq
      JOB_NAME: connector-postgres-to-bq

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build image
        working-directory: connectors/postgres-to-bq
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:${GITHUB_SHA::12}"
          docker build -t "$IMAGE_URI" -t "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:latest" .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker push "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:latest"

      - name: Update Cloud Run Job to point at new image
        run: |
          gcloud run jobs update "$JOB_NAME" \
            --image "$IMAGE_URI" \
            --region "$REGION" \
            --project "$PROJECT_ID"
