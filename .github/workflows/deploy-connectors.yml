name: Deploy connectors

on:
  push:
    branches: [main]
    paths: ["connectors/**", ".github/workflows/deploy-connectors.yml"]
  workflow_dispatch:
    inputs:
      connector:
        description: "Specific connector to (re)build (leave blank to build all listed in matrix)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-connectors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.connector }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # Only postgres-to-bq is in the active build matrix — its
      # `meltanolabs` tap-postgres variant is confirmed in Meltano Hub.
      # The other 6 connector image dirs exist on disk but each needs
      # its tap variant verified against hub.meltano.com before adding
      # back here. Track in Linear LIVELI-43.
      matrix:
        connector:
          - postgres-to-bq

    env:
      REGION: europe-west4
      PROJECT_ID: liveli-496609
      REPO: liveli-connectors

    steps:
      - uses: actions/checkout@v4

      - name: Skip if a specific connector was requested and this isn't it
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.connector != '' && github.event.inputs.connector != matrix.connector }}
        run: |
          echo "Skipping ${{ matrix.connector }} — workflow dispatched for ${{ github.event.inputs.connector }}"
          exit 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build image
        id: build
        working-directory: connectors/${{ matrix.connector }}
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:${GITHUB_SHA::12}"
          docker build \
            -t "$IMAGE_URI" \
            -t "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker push "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest"

      - name: Update Cloud Run Job image
        run: |
          gcloud run jobs update "connector-${{ matrix.connector }}" \
            --image "$IMAGE_URI" \
            --region "$REGION" \
            --project "$PROJECT_ID"
