name: Deploy connectors

on:
  push:
    branches: [main]
    paths: ["connectors/**", ".github/workflows/deploy-connectors.yml"]
  workflow_dispatch:
    inputs:
      connector:
        description: "Specific connector to (re)build (leave blank to build all listed in matrix)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-connectors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.connector }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # Each new connector is matrix-built independently — one failure
      # doesn't block the others. Image build time is ~6-8 min per
      # connector (meltano install dominates), so adding to this list
      # costs roughly that on the next push. Order is alphabetical for
      # readability — Cloud Run Job names are derived from the same
      # slug via `connector-<name>` in infra/cloud-run.tf.
      matrix:
        connector:
          - facebook-ads-to-bq
          - google-ads-to-bq
          - hubspot-to-bq
          - mailchimp-to-bq
          - mysql-to-bq
          - postgres-to-bq
          - salesforce-to-bq
          - shopify-to-bq
          - stripe-to-bq

    env:
      # Artifact Registry stays in europe-west4 — image binaries aren't
      # customer data, and Cloud Run can pull from any region. The
      # Cloud Run Jobs themselves are deployed PER RESIDENCY into the
      # regions listed in CLOUD_RUN_REGIONS (matches the EU/US suffix
      # scheme in infra/cloud-run.tf + src/lib/gcp.ts).
      AR_REGION: europe-west4
      PROJECT_ID: liveli-496609
      REPO: liveli-connectors

    steps:
      - uses: actions/checkout@v4

      - name: Skip if a specific connector was requested and this isn't it
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.connector != '' && github.event.inputs.connector != matrix.connector }}
        run: |
          echo "Skipping ${{ matrix.connector }} — workflow dispatched for ${{ github.event.inputs.connector }}"
          exit 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $AR_REGION-docker.pkg.dev --quiet

      - name: Build image
        id: build
        working-directory: connectors/${{ matrix.connector }}
        run: |
          IMAGE_URI="$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:${GITHUB_SHA::12}"
          docker build \
            -t "$IMAGE_URI" \
            -t "$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker push "$AR_REGION-docker.pkg.dev/$PROJECT_ID/$REPO/${{ matrix.connector }}:latest"

      # Update BOTH residency-suffixed jobs from the same image. The
      # job names are `connector-<type>-eu` (in europe-west1) and
      # `connector-<type>-us` (in us-central1) — see infra/cloud-run.tf.
      # Each region's job is updated independently; failure in one
      # doesn't block the other (set -e is on, but we tee through).
      - name: Update Cloud Run Job image (EU residency)
        run: |
          gcloud run jobs update "connector-${{ matrix.connector }}-eu" \
            --image "$IMAGE_URI" \
            --region "europe-west1" \
            --project "$PROJECT_ID"

      - name: Update Cloud Run Job image (US residency)
        run: |
          gcloud run jobs update "connector-${{ matrix.connector }}-us" \
            --image "$IMAGE_URI" \
            --region "us-central1" \
            --project "$PROJECT_ID"
