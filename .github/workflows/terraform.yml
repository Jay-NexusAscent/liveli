name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read
  id-token: write   # WIF
  pull-requests: write  # comment plan on PRs

jobs:
  plan:
    name: plan (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Per-module concurrency group — never cancel an in-flight apply for a
    # given module, but allow different modules to plan/apply in parallel
    # since they have separate state backends.
    concurrency:
      group: terraform-${{ matrix.module }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        # Each entry is a self-contained Terraform module with its own state.
        # The root `infra` is the main Liveli infra (APIs, BQ, Firestore,
        # Cloud Run, WIF, etc.). `infra/billing-cap` is the standalone
        # kill-switch module with its own state backend prefix.
        module: [infra, infra/billing-cap]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.10
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          MODULE: ${{ matrix.module }}
        with:
          script: |
            const module = process.env.MODULE;
            const out = require('child_process').execSync(
              'terraform show -no-color tfplan',
              { cwd: module, encoding: 'utf8' }
            );
            const body = `### Terraform plan — \`${module}\`\n\n\`\`\`\n${out.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: apply (${{ matrix.module }})
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production  # require manual approval via repo Environment settings

    concurrency:
      group: terraform-${{ matrix.module }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        module: [infra, infra/billing-cap]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.10
          terraform_wrapper: false

      - run: terraform init
      - run: terraform apply -auto-approve
