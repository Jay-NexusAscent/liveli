name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app — lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Lint disabled in CI — eslint-config-next + FlatCompat has a known
      # circular-JSON bug in current versions. Typecheck + build catch
      # all real issues. Run `pnpm lint` locally if you want stylistic
      # feedback. Re-enable here when next-eslint ships native flat config.
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # Clerk keys — real values in repo secrets, dummies for PR-from-fork.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_dummy' }}
          # Next.js page-data collection imports API route modules, which
          # import lib/gcp.ts. requireEnv() throws at module load without
          # these. Dummy values are fine — no GCP calls happen during build.
          GCP_PROJECT_ID: liveli-496609
          GCP_REGION: europe-west4
          VERTEX_AI_REGION: us-central1
          VERTEX_AI_MODEL: claude-opus-4-7

  dbt:
    name: dbt — parse / validate project graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs in parallel with the `app` job. dbt parse is purely static —
    # no warehouse needed — so it's cheap and catches:
    #   - duplicate model names (PR #93's miss: `dim_customers` defined
    #     across stripe / shopify / quickbooks; blocked the whole project
    #     from compiling, including GA4)
    #   - ref() targets that don't exist
    #   - source() tables not declared in any sources.yml
    #   - Jinja / YAML syntax errors
    # i.e. exactly the bugs that previously only surfaced at runtime in
    # the dbt-runner Cloud Run Job — by which point they'd blocked
    # every customer's curated tables.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: |
          pip install \
            'dbt-core>=1.9.0,<1.10.0' \
            'dbt-bigquery>=1.9.0,<1.10.0'

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: dbt parse
        working-directory: dbt
        # `parse` walks the project graph: resolves all ref()/source()
        # calls, checks for duplicate model names, validates YAML. No
        # BQ access needed (the empty-string defaults for target_project /
        # target_dataset suffice — parse doesn't execute SQL).
        run: |
          dbt parse --profiles-dir . --target prod --no-version-check \
            --vars '{target_project: ci-dummy, target_dataset: ci-dummy}'
